project:
  type: book
  output-dir: docs
  post-render: scripts/write_legacy_redirects.py

book:
  title: "Biomedical Knowledge Mining Toolkit"
  reader-mode: true
  author: "Guangchuang Yu"
  date: "11/18/2025"

  page-footer:
    left: |
      Biomedical Knowledge Mining Toolkit was written by Guangchuang Yu.
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  site-url: https://yulab-smu.top/biomedical-knowledge-mining-book/
  repo-url: https://github.com/YuLab-SMU/biomedical-knowledge-mining-book/
  repo-branch: main
  repo-actions: [edit, issue]
  chapters:
    - index.qmd

    - part: 00-start-here.qmd
      chapters:
        - first-workflow.qmd
        - data-contract.qmd
        - choose-a-route.qmd

    - part: 01-analysis-engines.qmd
      chapters:
        - enrichment-overview.qmd
        - enrichment-foundations.qmd
        - enrichment-network.qmd
        - enrichment-multiomics.qmd
        - comparecluster-analysis.qmd

    - part: 02-knowledge-sources.qmd
      chapters:
        - gson.qmd
        - go-enrichment.qmd
        - kegg-enrichment.qmd
        - reactome-enrichment.qmd
        - disease-enrichment.qmd
        - mesh-enrichment.qmd
        - universal-enrichment.qmd
        - other-databases.qmd
        - chipseeker-enrichment.qmd

    - part: 03-evidence-integration.qmd
      chapters:
        - identifier-utilities.qmd
        - result-objects.qmd
        - semantic-similarity.qmd
        - go-semantic-similarity.qmd
        - do-semantic-similarity.qmd
        - mesh-semantic-similarity.qmd
        - bayesian-term-selection.qmd
        - ppi.qmd

    - part: 04-visualization.qmd
      chapters:
        - enrichplot.qmd
        - enrichplot-summary.qmd
        - enrichplot-networks.qmd
        - enrichplot-gsea.qmd
        - enrichplot-comparison.qmd
        - comparecluster-visualization.qmd
        - enrichplot-specialized.qmd
        - enrichplot-import.qmd

    - part: 05-interpretation.qmd
      chapters:
        - interpretation-reading.qmd
        - interpretation.qmd
        - reproducible-report.qmd

    - part: 06-recipes-reference.qmd
      chapters:
        - recipes.qmd
        - leading-edge-nonmodel.qmd
        - troubleshooting.qmd
        - capability-map.qmd
        - glossary-api-index.qmd
        - appendix.qmd

bibliography: references.bib

execute: 
  cache: true

format:
  html:
    theme:
      - cosmo
    code-link: false

    author-meta: "Guangchuang Yu"
    callout-appearance: simple

editor: source


