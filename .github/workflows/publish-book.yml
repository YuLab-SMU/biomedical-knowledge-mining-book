name: Publish Quarto Book

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release
          
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libcairo2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libpq-dev

      - name: Install pak
        run: |
          Rscript -e 'install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")'

      - name: Install CRAN dependencies
        run: |
          Rscript -e 'options(Ncpus = 1); pak::pkg_install(c(
            "cran::tidyverse",
            "cran::emojifont",
            "cran::badger",
            "cran::cowplot",
            "cran::ggarchery",
            "cran::msigdbr",
            "cran::readxl",
            "cran::aplot",
            "cran::ggfun",
            "cran::ggplotify",
            "cran::wget",
            "cran::httr2",
            "cran::R.utils",
            "cran::europepmc",
            "cran::ggupset"
          ))'

      - name: Install Bioconductor dependencies (release)
        run: |
          Rscript -e 'install.packages("BiocManager", repos = "https://cran.r-project.org")'
          Rscript -e 'BiocManager::install(pkgs = c(
            "AnnotationHub",
            "ExperimentHub",
            "AnnotationHubData",
            "ChIPseeker",
            "DO.db",
            "GO.db",
            "org.Hs.eg.db",
            "org.Mm.eg.db",
            "MeSHDbi",
            "biomaRt",
            "pathview"
          ), ask = FALSE, update = FALSE)'

      - name: Install core YuLab packages (before clusterProfiler)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'options(Ncpus = 1); pak::pkg_install(c(
            "github::YuLab-SMU/yulab.utils",
            "github::YuLab-SMU/enrichit",
            "github::YuLab-SMU/ggtangle",
            "github::YuLab-SMU/GOSemSim",
            "github::YuLab-SMU/DOSE",
            "github::YuLab-SMU/enrichplot",
            "github::YuLab-SMU/tidytree",
            "github::YuLab-SMU/treeio",
            "github::YuLab-SMU/ggtree",
            "github::YuLab-SMU/ggtreeExtra"
          ))'

      - name: Install clusterProfiler (GitHub)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'options(Ncpus = 1); pak::pkg_install("github::YuLab-SMU/clusterProfiler")'

      - name: Install remaining YuLab-SMU packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'options(Ncpus = 1); pak::pkg_install(c(
            "github::YuLab-SMU/ReactomePA",
            "github::YuLab-SMU/meshes"
          ))'

      - name: Install MicrobiomeProfiler (after clusterProfiler)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'options(Ncpus = 1); pak::pkg_install("github::YuLab-SMU/MicrobiomeProfiler")'


      - name: Prewarm ontology caches (DO/HDO)
        run: |
          Rscript -e 'options(timeout=600); options(download.file.method="libcurl"); suppressWarnings(suppressMessages({
            try(GOSemSim:::load_onto("HDO"));
            fp <- path.expand("~/.local/share/GOSemSim/HDO.sqlite");
            if (!file.exists(fp)) try(yulab.utils::download_yulab_file("GOSemSim/HDO.sqlite"));
            if (!file.exists(fp)) stop("HDO.sqlite missing after download attempt")
          }))'

        
      - name: Render Quarto Book
        run: |
          quarto render
          
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quarto-render-log
          path: |
            _book
            docs
