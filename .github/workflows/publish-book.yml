name: Publish Quarto Book

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'
          use-public-rspm: true
          
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release
          
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libcairo2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libpq-dev

      - name: Install pak
        run: |
          Rscript -e 'install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")'

      - name: Install YuLab-SMU GitHub packages (sequential)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'options(Ncpus = 1); pak::pkg_install(c(
            "github::YuLab-SMU/yulab.utils",
            "github::YuLab-SMU/enrichit",
            "github::YuLab-SMU/ggtangle",
            "github::YuLab-SMU/GOSemSim",
            "github::YuLab-SMU/DOSE",
            "github::YuLab-SMU/clusterProfiler",
            "github::YuLab-SMU/enrichplot",
            "github::YuLab-SMU/ReactomePA",
            "github::YuLab-SMU/meshes",
            "github::YuLab-SMU/tidytree",
            "github::YuLab-SMU/treeio",
            "github::YuLab-SMU/ggtree",
            "github::YuLab-SMU/ggtreeExtra"
          ))'

      - name: Install Bioconductor dependencies (devel)
        run: |
          Rscript -e 'install.packages("BiocManager", repos = "https://cran.r-project.org")'
          Rscript -e 'BiocManager::install(version = "devel", ask = FALSE)'
          Rscript -e 'BiocManager::install(pkgs = c(
            "AnnotationHub",
            "ExperimentHub",
            "AnnotationHubData",
            "ChIPseeker",
            "DO.db",
            "GO.db",
            "org.Hs.eg.db",
            "org.Mm.eg.db",
            "MeSHDbi",
            "biomaRt",
            "pathview"
          ), ask = FALSE, update = FALSE)'

      - name: Install CRAN dependencies
        run: |
          Rscript -e 'options(Ncpus = 1); pak::pkg_install(c(
            "cran::tidyverse",
            "cran::emojifont",
            "cran::badger",
            "cran::cowplot",
            "cran::msigdbr",
            "cran::readxl",
            "cran::aplot",
            "cran::ggfun",
            "cran::ggplotify",
            "cran::wget"
          ))'

      - name: Install MicrobiomeProfiler (YuLab-SMU)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'options(Ncpus = 1); pak::pkg_install("github::YuLab-SMU/MicrobiomeProfiler")'
        
      - name: Render Quarto Book
        run: |
          quarto render
          
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quarto-render-log
          path: |
            _book
            docs
