name: Publish Quarto Book

on:
  push:
    branches: [ master, main ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession would otherwise queue two full renders that both
# deploy with force_orphan, and whichever finished last would win -- so a newer,
# better commit could be overwritten by the older build it superseded. Cancelling
# the in-flight run keeps the site consistent with the newest commit on the branch.
concurrency:
  group: publish-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release
          
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libcairo2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libpq-dev \
            libglpk-dev

      - name: Install pak
        run: |
          Rscript -e 'install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")'

      # ggforce is suggested by enrichplot >= 1.99.8: emapplot() and ssplot()
      # draw group outlines with the concave hull from ggforce when it is
      # installed and fall back to ggplot2::stat_ellipse() otherwise. Installing
      # it here lets the book demonstrate the concave hull rendering.
      # Keep comments out of the Rscript string below; an apostrophe inside the
      # single-quoted shell argument truncates the script.
      - name: Install CRAN dependencies
        run: |
          # Transient network failures during installation have been
          # the main cause of failed weekly builds.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i"; sleep 30; done; return 1; }
          # dplyr, ggplot2, stringr and forcats are called directly with pkg:: in
          # executed chunks. They currently arrive only as transitive dependencies of
          # clusterProfiler, enrichplot and biomaRt; a chapter that calls a package
          # should not depend on another package happening to import it.
          #
          # The next four are the same situation one level deeper: none of them is
          # named in any .qmd, but enrichplot calls require_suggested() on them from
          # inside plotting methods the book executes, and a missing one aborts the
          # render rather than degrading:
          #
          #   ggarchery  goplot.enrichResult()             enrichplot-specialized.qmd
          #   europepmc  pmcplot()                         enrichplot-specialized.qmd
          #   ggstar     dotplot.compareClusterResult()    the compareCluster chapters
          #   ggrepel    .manhattanplot_internal()         enrichplot-summary.qmd
          #
          # ggstar and ggrepel probably arrive transitively today (ggtreeExtra,
          # ggplot2). Listing them costs a few seconds and stops that from silently
          # becoming the next failure.
          #
          # R.utils is in the same category and subtler: yulab.utils needs it because
          # download_yulab_file(..., gzfile = TRUE) calls R.utils::gunzip() after
          # fetching the ontology cache, and the only copy of HDO.sqlite on the
          # server is the gzipped one. check_pkg() then aborts, and
          # download_yulab_file swallows that into FALSE and returns the destination
          # path as though the download had worked, so the cache is silently absent
          # and the HDO prewarm step fails.
          #
          # The rule these four share: trim by runtime reachability, never by counting
          # mentions in the .qmd sources. A dependency that lives inside another
          # package's code is invisible to text search.
          retry Rscript -e 'options(Ncpus = 1); pak::pkg_install(c(
            "cran::dplyr",
            "cran::ggplot2",
            "cran::stringr",
            "cran::forcats",
            "cran::emojifont",
            "cran::badger",
            "cran::cowplot",
            "cran::msigdbr",
            "cran::readxl",
            "cran::aplot",
            "cran::ggtext",
            "cran::ggplotify",
            "cran::wget",
            "cran::httr2",
            "cran::dotenv",
            "cran::R.utils",
            "cran::ggarchery",
            "cran::europepmc",
            "cran::ggstar",
            "cran::ggrepel",
            "cran::ggupset",
            "cran::ggridges",
            "cran::shadowtext",
            "cran::ggforce"
          ))'

      - name: Install Bioconductor dependencies (release)
        run: |
          # Transient network failures during installation have been
          # the main cause of failed weekly builds.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i"; sleep 30; done; return 1; }
          retry Rscript -e 'install.packages("BiocManager", repos = "https://cran.r-project.org")'
          retry Rscript -e 'BiocManager::install(pkgs = c(
            "AnnotationHub",
            "ChIPseeker",
            "GO.db",
            "org.Hs.eg.db",
            "org.Mm.eg.db",
            "MeSHDbi",
            "biomaRt",
            "fgsea",
            "pathview"
          ), ask = FALSE, update = FALSE)'

      - name: Verify required packages are loadable
        # Everything the executed chunks reach, including packages that no chapter
        # names but that enrichplot loads from inside a plotting method and that
        # yulab.utils needs for the ontology cache. Checking here costs seconds;
        # finding the same omission from a render abort costs a full install and a
        # half-finished book.
        run: |
          Rscript -e 'required <- c(
            "org.Hs.eg.db", "fgsea", "GO.db", "ChIPseeker", "MeSHDbi", "biomaRt", "pathview",
            "R.utils", "ggarchery", "europepmc", "ggstar", "ggrepel", "ggupset", "ggridges",
            "ggplotify", "httr2", "dotenv", "msigdbr", "ggplot2", "dplyr", "stringr", "forcats"
          ); missing <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) stop("Missing packages: ", paste(missing, collapse = ", "))'

      # aisdk.providers carries the DeepSeek and other non-bundled adapters;
      # without it interpret() fails with "Provider not found: deepseek".
      # gson and ggfun come from GitHub rather than CRAN. gson was never pinned
      # here, so pak resolved the transitive dependency at CRAN 0.2.1, while the
      # custom-gson chunk in gson.qmd calls gson() with gsidtype=, added in
      # 0.2.2. ggtangle needs geom_bezier(), added in ggfun 0.2.2, and a CRAN or
      # RSPM mirror can keep serving 0.2.1 after a release.
      # Comments stay out of the Rscript string; an apostrophe there closes the
      # shell quoting and truncates the script.
      - name: Install foundational YuLab packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Transient network failures during installation have been
          # the main cause of failed weekly builds.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i"; sleep 30; done; return 1; }
          retry Rscript -e 'options(Ncpus = 1); pak::pkg_install(c(
            "github::YuLab-SMU/yulab.utils",
            "github::YuLab-SMU/aisdk",
            "github::YuLab-SMU/aisdk.providers",
            "github::YuLab-SMU/GOSemSim",
            "github::YuLab-SMU/tidytree",
            "github::YuLab-SMU/treeio",
            "github::YuLab-SMU/gson",
            "github::YuLab-SMU/ggfun",
            "github::YuLab-SMU/ggtangle"
          ))'

      - name: Install dependent YuLab packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Transient network failures during installation have been
          # the main cause of failed weekly builds.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i"; sleep 30; done; return 1; }
          retry Rscript -e 'options(Ncpus = 1); pak::pkg_install(c(
            "github::YuLab-SMU/enrichit",
            "github::YuLab-SMU/DOSE",
            "github::YuLab-SMU/enrichplot",
            "github::YuLab-SMU/ggtree",
            "github::YuLab-SMU/ggtreeExtra"
          ))'

      - name: Install clusterProfiler (GitHub)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Transient network failures during installation have been
          # the main cause of failed weekly builds.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i"; sleep 30; done; return 1; }
          retry Rscript -e 'options(Ncpus = 1); pak::pkg_install("github::YuLab-SMU/clusterProfiler")'

      - name: Install remaining YuLab-SMU packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Transient network failures during installation have been
          # the main cause of failed weekly builds.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i"; sleep 30; done; return 1; }
          retry Rscript -e 'options(Ncpus = 1); pak::pkg_install(c(
            "github::YuLab-SMU/ReactomePA",
            "github::YuLab-SMU/meshes"
          ))'

      - name: Prewarm ontology caches (DO/HDO)
        # Two separate failures used to live in this step, and neither produced a
        # useful message.
        #
        # 1. download_yulab_file() is (destfile, urls, gzfile, appname). The
        #    fallback passed the filename positionally, so `urls` went missing.
        # 2. The parent directory did not exist on a fresh runner.
        #    download_yulab_file() writes through httr2, cannot create the
        #    directory, and returns the path as if it had succeeded. The step then
        #    failed 0.1s later with "HDO.sqlite missing after download attempt",
        #    which reads like a network problem and is not one -- so wrapping it
        #    in retry() could never help. Verified both halves locally: the same
        #    call downloads 10.95 MB once dir.create() runs first.
        #
        # The URL list is the one GOSemSim:::load_onto() itself passes; keep the
        # two in step. user_dir() replaces the hardcoded path so a change to the
        # convention does not break this quietly too.
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i"; sleep 30; done; return 1; }
          retry Rscript -e 'options(timeout=600); options(download.file.method="libcurl"); suppressWarnings(suppressMessages({
            fp <- path.expand(file.path(yulab.utils::user_dir("GOSemSim"), "HDO.sqlite"));
            dir.create(dirname(fp), recursive = TRUE, showWarnings = FALSE);
            try(GOSemSim:::load_onto("HDO"));
            if (!file.exists(fp)) try(yulab.utils::download_yulab_file(
              fp,
              c("https://yulab-smu.top/DOSE",
                "https://raw.githubusercontent.com/YuLab-SMU/DOSE/refs/heads/gh-pages"),
              gzfile = TRUE));
            if (!file.exists(fp)) stop("HDO.sqlite missing at ", fp,
              " -- download_yulab_file() reports success when it cannot write")
          }))'

        
      - name: Render Quarto Book
        # The interpret() examples in interpretation.qmd run only when this key
        # is present. GitHub does not expose secrets to workflows triggered from
        # forked repositories, so there the chunk is skipped instead of failing.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          quarto render
          
      # The table in REPRODUCIBILITY.md records the LOCAL validation baseline. CI
      # installs from github::YuLab-SMU/*, so the deployed pages run development
      # versions that do not match it. Publish the real provenance of this build
      # next to the site instead of pretending the table describes it.
      - name: Record build provenance
        # A fresh `Rscript` has none of the book packages loaded, so a bare
        # sessionInfo() records only the base packages -- which is what the
        # first version of this step did, while REPRODUCIBILITY.md told readers
        # to look here for the DOSE/GOSemSim versions the deployed pages ran
        # against. Name the packages the chapters actually use.
        run: |
          mkdir -p docs
          Rscript -e 'pkgs <- c(
            "clusterProfiler", "enrichit", "enrichplot", "GOSemSim", "DOSE",
            "ReactomePA", "meshes", "ChIPseeker", "gson", "yulab.utils",
            "aisdk", "airway", "DESeq2", "fgsea", "org.Hs.eg.db", "org.Mm.eg.db"
          ); ver <- vapply(pkgs, function(p) tryCatch(as.character(packageVersion(p)),
            error = function(e) "not installed"), character(1));
          writeLines(c(capture.output(print(sessionInfo())), "",
            "Book package versions:", sprintf("%s %s", names(ver), ver),
            paste("Bioconductor:", as.character(BiocManager::version()))),
            "docs/SESSION-INFO.txt")'

      - name: Validate navigation and source/generated links
        run: |
          python3 scripts/check_navigation.py
          python3 scripts/check_links.py
          python3 scripts/check_bibliography.py
          python3 scripts/check_package_macros.py

      # Runs here rather than in validate-book.yml because it is only
      # meaningful once the book packages are installed, and this job already
      # has them. This is the check that catches a `foo()` in the prose which no
      # package exports -- the defect class that shipped a nonexistent
      # weighted_enrich() and a wrong createKEGGdb() while both older checks
      # stayed green.
      - name: Validate function names against installed package exports
        run: Rscript scripts/check_api_names.R

      # Also needs the render output, so it belongs here and not in
      # validate-book.yml. This is the guard for issue #41: enrichment plots
      # draw one graphical element per gene, and a single four-panel cnetplot()
      # once weighed 13.2 MB, which is enough to make a page take minutes to
      # render. It reads the generated HTML rather than scanning docs/, because
      # Quarto leaves the previous build's figure files behind and a directory
      # scan would keep reporting a figure nobody links to.
      - name: Validate figure payload size
        run: python3 scripts/check_figure_sizes.py

      # scripts/check_versions.R is deliberately NOT run here. The table in
      # REPRODUCIBILITY.md is the local validation baseline, while this job
      # installs github::YuLab-SMU/* development versions that are documented to
      # differ from it. Running the check would fail on a mismatch that is
      # intended, and would teach readers to ignore it.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quarto-render-log
          path: |
            _book
            docs
